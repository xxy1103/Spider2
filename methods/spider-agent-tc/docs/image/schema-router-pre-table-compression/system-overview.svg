<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Schema Router 前置表压缩系统总览</title>
  <desc id="desc">任务、元数据和外部知识先进入表族目录，再由 Schema Router 子 Agent 选择候选表，最终把压缩后的表集合交给主 Agent。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55738f"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <text x="70" y="74" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#18344f">前置表压缩：先缩小检索面，再让主 Agent 写 SQL</text>
  <text x="70" y="111" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#587086">Schema Router 只做候选表路由，不执行 SQL，也不回答业务问题</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="250" height="360" rx="22" fill="#ffffff" stroke="#b8c8d8"/>
    <rect x="70" y="170" width="250" height="64" rx="22" fill="#e6f0fa"/>
    <text x="195" y="211" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#285777">输入事实</text>
    <text x="102" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">用户问题</text>
    <text x="102" y="323" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">允许的 database</text>
    <text x="102" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">External Knowledge</text>
    <text x="102" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">Schema JSON / DDL</text>
    <text x="102" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">有界样例行</text>
    <rect x="96" y="477" width="198" height="32" rx="16" fill="#f1f5f8"/>
    <text x="195" y="499" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6d7f8f">不包含官方 SQL 标签</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="170" width="250" height="360" rx="22" fill="#ffffff" stroke="#b8c8d8"/>
    <rect x="390" y="170" width="250" height="64" rx="22" fill="#e8f5ef"/>
    <text x="515" y="211" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#2b6950">确定性压缩</text>
    <text x="422" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">识别日期后缀</text>
    <text x="422" y="323" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">识别年度 / 周期</text>
    <text x="422" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">识别版本序列</text>
    <text x="422" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">计算公共列与差异列</text>
    <text x="422" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">生成逻辑表族目录</text>
    <rect x="416" y="477" width="198" height="32" rx="16" fill="#edf7f2"/>
    <text x="515" y="499" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#47715e">物理表 → 逻辑表族</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="170" width="250" height="360" rx="22" fill="#ffffff" stroke="#b8c8d8"/>
    <rect x="710" y="170" width="250" height="64" rx="22" fill="#f1eafa"/>
    <text x="835" y="211" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#624b83">Schema Router</text>
    <text x="742" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">搜索候选表族</text>
    <text x="742" y="323" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">查看 DDL 与样例</text>
    <text x="742" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">解析日期 / 版本范围</text>
    <text x="742" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">排序并标注角色</text>
    <text x="742" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#233f58">提交结构化选择</text>
    <rect x="736" y="477" width="198" height="32" rx="16" fill="#f4effa"/>
    <text x="835" y="499" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6d568c">有界轮次 + 严格校验</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="170" width="180" height="360" rx="22" fill="#ffffff" stroke="#b8c8d8"/>
    <rect x="1030" y="170" width="180" height="64" rx="22" fill="#fff1dd"/>
    <text x="1120" y="211" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#845b24">交接结果</text>
    <text x="1120" y="287" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#233f58">候选表族</text>
    <text x="1120" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#233f58">物理表清单</text>
    <text x="1120" y="373" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#233f58">优先级 / 角色</text>
    <text x="1120" y="416" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#233f58">选择理由</text>
    <rect x="1054" y="461" width="132" height="48" rx="18" fill="#fff5e8"/>
    <text x="1120" y="481" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#7a5a32">供主 Agent</text>
    <text x="1120" y="499" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#7a5a32">后续消费</text>
  </g>

  <line x1="320" y1="350" x2="380" y2="350" stroke="#55738f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="640" y1="350" x2="700" y2="350" stroke="#55738f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="960" y1="350" x2="1020" y2="350" stroke="#55738f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="70" y="592" width="1140" height="70" rx="18" fill="#18344f"/>
  <text x="640" y="621" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">安全边界</text>
  <text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#d9e7f2">本地元数据只读 · 单数据库隔离 · 不连接 Snowflake · 不执行 SQL · 不接触官方答案</text>
</svg>
