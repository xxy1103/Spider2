<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">物理表到逻辑表族的压缩</title>
  <desc id="desc">多个日期分表、年度表和版本表被确定性归并为逻辑表族，同时保留每个物理表的变体值和列差异。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b748c"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <text x="70" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#193750">表族压缩不是删表，而是建立可逆的逻辑索引</text>
  <text x="70" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5c7388">每个逻辑表族仍保留物理表名称、变体值、公共列、差异列与结构相似度</text>

  <text x="90" y="166" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#345570">压缩前：物理表清单</text>
  <g filter="url(#shadow)" font-family="Consolas, Microsoft YaHei, monospace" font-size="17">
    <rect x="70" y="190" width="460" height="56" rx="12" fill="#ffffff" stroke="#b8c9d8"/><text x="94" y="225" fill="#29465f">EVENTS_20240101</text>
    <rect x="70" y="258" width="460" height="56" rx="12" fill="#ffffff" stroke="#b8c9d8"/><text x="94" y="293" fill="#29465f">EVENTS_20240102</text>
    <rect x="70" y="326" width="460" height="56" rx="12" fill="#ffffff" stroke="#b8c9d8"/><text x="94" y="361" fill="#29465f">EVENTS_20240103</text>
    <rect x="70" y="410" width="460" height="56" rx="12" fill="#ffffff" stroke="#b8c9d8"/><text x="94" y="445" fill="#29465f">POPULATION_2022</text>
    <rect x="70" y="478" width="460" height="56" rx="12" fill="#ffffff" stroke="#b8c9d8"/><text x="94" y="513" fill="#29465f">POPULATION_2023</text>
    <rect x="70" y="562" width="460" height="56" rx="12" fill="#ffffff" stroke="#b8c9d8"/><text x="94" y="597" fill="#29465f">REGION_MAP_01 / REGION_MAP_02</text>
  </g>

  <path d="M555 355 C610 355, 610 355, 662 355" fill="none" stroke="#5b748c" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="566" y="300" width="86" height="92" rx="43" fill="#e7f2ec"/>
  <text x="609" y="336" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2d6a50">命名规则</text>
  <text x="609" y="360" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2d6a50">+</text>
  <text x="609" y="382" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2d6a50">列相似度</text>

  <text x="700" y="166" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#345570">压缩后：逻辑表族目录</text>
  <g filter="url(#shadow)">
    <rect x="680" y="190" width="530" height="130" rx="18" fill="#ffffff" stroke="#81b79d" stroke-width="2"/>
    <text x="710" y="226" font-family="Consolas, Microsoft YaHei, monospace" font-size="20" font-weight="700" fill="#246044">EVENTS_{YYYYMMDD}</text>
    <text x="710" y="259" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#36546b">类型：date　变体：20240101, 20240102, 20240103</text>
    <text x="710" y="291" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#36546b">选择器：all / exact / date_ranges</text>

    <rect x="680" y="340" width="530" height="130" rx="18" fill="#ffffff" stroke="#7ba3c6" stroke-width="2"/>
    <text x="710" y="376" font-family="Consolas, Microsoft YaHei, monospace" font-size="20" font-weight="700" fill="#285d84">POPULATION_{YEAR}</text>
    <text x="710" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#36546b">类型：year　变体：2022, 2023</text>
    <text x="710" y="441" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#36546b">选择器：all / exact / versions</text>

    <rect x="680" y="490" width="530" height="130" rx="18" fill="#ffffff" stroke="#a38ac1" stroke-width="2"/>
    <text x="710" y="526" font-family="Consolas, Microsoft YaHei, monospace" font-size="20" font-weight="700" fill="#684d88">REGION_MAP_{VERSION}</text>
    <text x="710" y="559" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#36546b">类型：version　变体：01, 02</text>
    <text x="710" y="591" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#36546b">选择器：all / exact / versions</text>
  </g>
  <rect x="70" y="653" width="1140" height="38" rx="19" fill="#eaf0f5"/>
  <text x="640" y="678" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#405c73">压缩只减少目录与候选表达规模；最终输出仍展开成可执行的完整物理表清单</text>
</svg>
