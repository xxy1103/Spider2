experiment:
  name: first-50-test
  results_root: methods/spider-agent-tc/results
  resume: true

secrets_file: methods/spider-agent-tc/configs/secrets.yaml

paths:
  input_file: spider2-snow/spider2-snow.jsonl
  databases: spider2-snow/resource/databases
  documents: spider2-snow/resource/documents
  system_prompt: methods/spider-agent-tc/prompts/spider_agent.txt

tasks:
  instance_ids:
    # - sf_bq003
    # - sf_bq008
    # - sf_bq009
    # - sf_bq026
    # - sf_bq036
    # - sf_bq099
    # - sf_bq180
    # - sf_bq193
    # - sf_bq207
    # - sf_bq210
    # - sf_bq214
    # - sf_bq215
    # - sf_bq221
    # - sf_bq222
    # - sf_bq246
    # - sf_bq270
    - sf_bq275
    # - sf_bq374
    # - sf_bq420
  index_ranges: []
  databases: []
  sample_size: null
  seed: 42
  order: seeded_shuffle

model:
  name: deepseek-v4-pro
  temperature: 0
  top_p: 1
  max_tokens: 100000
  request_timeout_seconds: 180
  retry:
    max_attempts: 3
    initial_delay_seconds: 1
    backoff_multiplier: 2
    max_delay_seconds: 10

agent:
  max_rounds: 60
  num_threads: 4
  rollout_number: 1

server:
  host: 127.0.0.1
  preferred_port: 5000
  workers_per_tool: 8
  startup_timeout_seconds: 20
  request_timeout_seconds: 150

tools:
  catalog:
    page_size: 50
    max_page_size: 100
    sample_rows: 3
    max_sample_chars: 12000
  sql:
    mode: live
    timeout_seconds: 120
    preview_rows: 20
    max_page_size: 100
  submission:
    require_executed: true
    reject_empty: true

preflight:
  check_model: true
  check_snowflake: true

# 自动评分配置（可选）
auto_evaluate:
  enabled: true        # 是否在运行结束后自动评分
  timeout: 300         # SQL 执行超时时间（秒）
  max_workers: 4       # 并行评分的线程数
