experiment:
  name: first-50-test-gemini3.1-pro
  results_root: methods/spider-agent-tc/results
  resume: true

secrets_file: methods/spider-agent-tc/configs/secrets.yaml

paths:
  input_file: spider2-snow/spider2-snow.jsonl
  databases: spider2-snow/resource/databases
  documents: spider2-snow/resource/documents
  system_prompt: methods/spider-agent-tc/prompts/spider_agent.txt

tasks:
  instance_ids: []
  index_ranges:
    - "0-49"
  databases: []
  sample_size: null
  seed: 42
  order: seeded_shuffle

model:
  #name: deepseek-v4-pro
  name: gemini-pro-agent
  temperature: 0.2
  top_p: 1
  max_tokens: 100000
  request_timeout_seconds: 180
  retry:
    max_attempts: 3
    initial_delay_seconds: 1
    backoff_multiplier: 2
    max_delay_seconds: 10

agent:
  max_rounds: 60
  num_threads: 4
  rollout_number: 1

schema_router:
  enabled: true
  prompt: methods/spider-agent-tc/prompts/schema_router.txt
  model:
    name: gemini-pro-agent
    temperature: 0.2
    top_p: 1
    max_tokens: 12000
    request_timeout_seconds: 180
    retry:
      max_attempts: 3
      initial_delay_seconds: 1
      backoff_multiplier: 2
      max_delay_seconds: 10
  max_rounds: 10
  max_tool_calls: 24
  num_threads: 4
  sample_rows: 1
  max_sample_chars: 4000
  integration:
    mode: strict
    include_tiers:
      - required
      - supporting
      - possible
    failure_policy: fail_task

server:
  host: 127.0.0.1
  preferred_port: 5000
  workers_per_tool: 8
  startup_timeout_seconds: 20
  request_timeout_seconds: 150

tools:
  catalog:
    page_size: 50
    max_page_size: 100
    sample_rows: 3
    max_sample_chars: 12000
  sql:
    mode: live
    timeout_seconds: 120
    preview_rows: 20
    max_page_size: 100
  submission:
    require_executed: true
    reject_empty: true

preflight:
  check_model: true
  check_snowflake: true

# 自动评分配置（可选）
auto_evaluate:
  enabled: true        # 是否在运行结束后自动评分
  timeout: 300         # SQL 执行超时时间（秒）
  max_workers: 4       # 并行评分的线程数
